[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motor-claims-analytics-warehouse"
version = "0.1.0"
description = "Dimensional warehouse for NYC motor collision analytics"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
warehouse = ["dbt-postgres>=1.8,<2", "psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
where = ["src"]
