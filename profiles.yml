motor_claims_warehouse:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_PORT', '5432') | int }}"
      user: "{{ env_var('DBT_USER', 'warehouse') }}"
      password: "{{ env_var('DBT_PASSWORD', 'warehouse_dev_only') }}"
      dbname: "{{ env_var('DBT_DATABASE', 'motor_dwh') }}"
      schema: public
      threads: 4
