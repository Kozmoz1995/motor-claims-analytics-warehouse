name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m motor_dwh.cli validate-sample

  dbt-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "dbt-postgres>=1.8,<2"
      - run: dbt deps
      - run: dbt parse --profiles-dir . --profile motor_claims_warehouse
        env:
          DBT_PROFILES_DIR: .
        continue-on-error: false
